
name: OSE Experiment 001

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/ose/**"
      - "scripts/run_experiment_001.py"
      - ".github/workflows/experiment-001.yml"

permissions:
  contents: read

jobs:
  run-experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Verify repository structure
        run: |
          python --version
          test -f src/ose/experiment_runner.py
          test -f src/ose/objectives.py
          test -f src/ose/optimizers.py
          test -f scripts/run_experiment_001.py
          echo "Required files found."

      - name: Run Experiment 001
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_experiment_001.py

      - name: Verify experiment outputs
        run: |
          test -s results/experiment_001_sphere.csv
          test -s results/experiment_001_summary.json
          python -m json.tool results/experiment_001_summary.json
          echo "Experiment outputs verified."

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ose-experiment-001-results
          path: |
            results/experiment_001_sphere.csv
            results/experiment_001_summary.json
          if-no-files-found: warn
